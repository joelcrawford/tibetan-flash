name: Deploy

on:
  push:
    branches: [main]
    # Only what the deploy actually touches. Without this, a docs- or
    # iOS-only merge rebuilds and redeploys the web app and cycles PM2 —
    # downtime for a change the server cannot see.
    paths:
      - "apps/web/**"
      - "server/**"
      - "src/python/**"
      - "ecosystem.config.cjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
      - "ops/**"
  # Redeploy without an empty commit — and the way to deploy a change
  # this filter deliberately ignores.
  workflow_dispatch:

# Never cancel mid-deploy: the install runs in its own systemd unit on the
# server, so a cancel wouldn't stop it — it would only fail the next run.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm --prefix apps/web run build

      # The server does the rest: /usr/local/sbin/deploy-tibetan-flash takes the
      # build as a tarball on stdin, resets its own clone to origin/main, and
      # runs ops/deploy.sh. The key is pinned to that wrapper, so this command
      # is all it can send. DEPLOY_KNOWN_HOSTS pins the server's host key.
      - name: Deploy
        env:
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf - -C apps/web/dist . \
            | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
                "$DROPLET_USER@$DROPLET_IP" /usr/local/sbin/deploy-tibetan-flash deploy
